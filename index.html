<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COSMIC CLICKER</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #020010;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        canvas { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; }

        .game-wrapper {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 16px; width: 100%; max-width: 450px; min-height: 100vh;
            gap: 16px;
        }

        .title {
            font-size: 20px; color: #8888cc; letter-spacing: 4px;
            text-shadow: 0 0 25px #4444aa;
        }

        .click-area {
            width: 190px; height: 190px; border-radius: 50%; cursor: pointer;
            position: relative; transition: transform 0.05s;
            display: flex; align-items: center; justify-content: center;
        }
        .click-area:active { transform: scale(0.88); }
        .click-area .glow {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.35); opacity: 1; }
        }
        .click-area .click-skin {
            font-size: 80px; position: relative; z-index: 2;
            animation: spin 12s linear infinite;
            text-shadow: 0 0 40px #aabbff, 0 0 80px #6666cc;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .counter {
            font-size: 32px; color: #d0d0ff;
            text-shadow: 0 0 30px #6666cc; letter-spacing: 3px;
        }
        .per-click { font-size: 11px; color: #8888bb; letter-spacing: 1px; }

        .info-row {
            display: flex; gap: 10px; font-size: 11px;
            color: #aaaacc; flex-wrap: wrap; justify-content: center;
        }
        .info-row span {
            background: #0a0a1e; padding: 6px 14px; border-radius: 10px;
            border: 1px solid #1a1a40; font-size: 12px;
        }

        .bonus-bar {
            width: 100%; background: #0a0a1e; border: 1px solid #1a1a40;
            padding: 10px 14px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; color: #ffdd88;
        }
        .bonus-bar button {
            background: #ff8800; color: #000; border: none;
            padding: 8px 16px; font-family: 'Courier New', monospace;
            font-size: 12px; border-radius: 10px; cursor: pointer; font-weight: bold;
        }
        .bonus-bar button:disabled { background: #00aa44; color: #fff; }

        .meteor-alert {
            position: fixed; top: 10%; left: 50%; transform: translateX(-50%);
            background: #ff6600; color: #fff; padding: 12px 24px;
            border-radius: 20px; font-family: 'Courier New', monospace;
            font-size: 16px; font-weight: bold; z-index: 200;
            display: none; animation: meteorPulse 0.5s ease-in-out infinite;
        }
        @keyframes meteorPulse {
            0%, 100% { box-shadow: 0 0 20px #ff6600; }
            50% { box-shadow: 0 0 50px #ffaa00, 0 0 80px #ff4400; }
        }

        .floating-bonus {
            position: fixed; font-size: 45px; z-index: 150;
            cursor: pointer; animation: bonusFloat 4s ease-in-out infinite;
            filter: drop-shadow(0 0 18px #ffdd00); pointer-events: auto;
        }
        @keyframes bonusFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-30px) rotate(90deg); }
            50% { transform: translateY(0) rotate(180deg); }
            75% { transform: translateY(-30px) rotate(270deg); }
        }

        .reward-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #0a0020; border: 3px solid #ffd700; padding: 24px;
            border-radius: 24px; z-index: 400; text-align: center;
            display: none; animation: rewardBounce 0.5s ease-out;
            box-shadow: 0 0 80px #ffd700, 0 0 160px #ffaa00;
        }
        @keyframes rewardBounce {
            0% { transform: translate(-50%, -50%) scale(0); }
            60% { transform: translate(-50%, -50%) scale(1.15); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        .reward-popup .reward-icon { font-size: 70px; }
        .reward-popup .reward-text { color: #ffd700; font-size: 22px; font-weight: bold; margin: 12px 0; }
        .reward-popup .reward-amount { color: #fff; font-size: 28px; font-weight: bold; }

        .tabs {
            display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
        }
        .tab-btn {
            background: #0a0a20; color: #8888bb; border: 1px solid #1a1a40;
            padding: 10px 16px; cursor: pointer; font-family: 'Courier New', monospace;
            font-size: 11px; letter-spacing: 1px; border-radius: 12px;
        }
        .tab-btn.active {
            background: #1a1040; color: #bbbbff; border-color: #4444aa;
            box-shadow: 0 0 12px #3333aa;
        }

        .panel {
            background: #060615; border: 1px solid #15153a;
            width: 100%; max-height: 220px; overflow-y: auto;
            padding: 10px; display: none; border-radius: 10px;
        }
        .panel.active { display: block; }

        .item-row {
            background: #0a0a1e; border: 1px solid #151535;
            padding: 10px 12px; margin-bottom: 4px; display: flex;
            justify-content: space-between; align-items: center;
            color: #aaaacc; font-size: 12px; border-radius: 6px;
        }
        .item-row button {
            background: #200840; color: #cc99ff; border: none;
            padding: 6px 14px; cursor: pointer; font-family: 'Courier New', monospace;
            font-size: 11px; border-radius: 8px; font-weight: bold;
        }
        .item-row button.owned { background: #003300; color: #88ff88; }
        .item-row button.active { background: #ffaa00; color: #000; }
        .item-row button:disabled { opacity: 0.4; }

        .leaderboard-item {
            background: #0a0a1e; border: 1px solid #151535;
            padding: 8px 10px; margin-bottom: 3px; display: flex;
            justify-content: space-between; align-items: center;
            color: #aaaacc; font-size: 11px; border-radius: 5px;
        }
        .leaderboard-item.top1 { border-color: #ffd700; background: #1a1a00; }
        .leaderboard-item.top2 { border-color: #c0c0c0; background: #1a1a1a; }
        .leaderboard-item.top3 { border-color: #cd7f32; background: #1a0a00; }

        .floating-text {
            position: fixed; pointer-events: none; font-family: 'Courier New', monospace;
            font-size: 16px; color: #ccbbff; z-index: 50;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 12px #6666cc;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-60px); }
        }
        .crit-text { color: #ffdd00 !important; font-size: 22px !important; text-shadow: 0 0 25px #ffaa00 !important; }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>

    <div class="game-wrapper">
        <div class="title">✦ COSMIC CLICKER ✦</div>

        <div class="click-area" id="clickArea">
            <div class="glow" id="clickGlow"></div>
            <div class="click-skin" id="clickSkin">✦</div>
        </div>

        <div class="counter" id="counter">0 ✦</div>
        <div class="per-click" id="perClick">+1 за клик</div>

        <div class="info-row">
            <span id="rankDisplay">🏆 #-</span>
            <span id="starDisplay">✦: 0</span>
            <span id="limitDisplay">0/500</span>
        </div>

        <div class="bonus-bar" id="bonusBar">
            <span>🔥 Ежедневный бонус</span>
            <span class="streak" id="streakDisplay">День 1</span>
            <button id="claimBonusBtn">Забрать</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="invTab">🎒 Моё</button>
            <button class="tab-btn" id="skinsTab">🎨 Скины</button>
            <button class="tab-btn" id="shopTab">🛒 Бусты</button>
            <button class="tab-btn" id="lbTab">🏆 Топ</button>
        </div>

        <div class="panel active" id="inventory"></div>
        <div class="panel" id="skins"></div>
        <div class="panel" id="shop"></div>
        <div class="panel" id="leaderboard"></div>
    </div>

    <div class="meteor-alert" id="meteorAlert">☄️ ЗВЁЗДНЫЙ ДОЖДЬ! x5 КЛИКИ! ☄️</div>

    <div class="reward-popup" id="rewardPopup">
        <div class="reward-icon" id="rewardIcon">🎁</div>
        <div class="reward-text" id="rewardText"></div>
        <div class="reward-amount" id="rewardAmount"></div>
    </div>

    <script>
        (function() {
            var tg = window.Telegram.WebApp;
            tg.ready(); tg.expand();

            var userId = 'demo';
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) userId = tg.initDataUnsafe.user.id.toString();

            var canvas = document.getElementById('starfield');
            var ctx = canvas.getContext('2d');
            var starsArray = [];

            function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
            resizeCanvas(); addEventListener('resize', function() { resizeCanvas(); createStars(); });

            function createStars() {
                starsArray = [];
                for (var i = 0; i < 200; i++) starsArray.push({
                    x: Math.random()*canvas.width, y: Math.random()*canvas.height,
                    r: Math.random()*1.5+0.3, phase: Math.random()*Math.PI*2,
                    freq: Math.random()*0.015+0.005, baseAlpha: Math.random()*0.5+0.3
                });
            }
            createStars();

            var meteors = [], meteorShowerActive = false;

            function drawStars() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (var i = 0; i < starsArray.length; i++) {
                    var s = starsArray[i]; s.phase += s.freq;
                    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(200,200,255,' + s.baseAlpha*(0.5+0.5*Math.sin(s.phase)) + ')';
                    ctx.fill();
                }
                if (meteorShowerActive) {
                    if (Math.random()<0.4) meteors.push({ x: Math.random()*canvas.width, y: -20, speed: Math.random()*8+5, size: Math.random()*3+1, opacity: 1, trail: [] });
                    for (var j = meteors.length-1; j>=0; j--) {
                        var m = meteors[j]; m.trail.push({x:m.x,y:m.y});
                        if (m.trail.length>15) m.trail.shift();
                        m.x+=m.speed*0.5; m.y+=m.speed*2; m.opacity-=0.01;
                        if (m.opacity<=0||m.y>canvas.height+50) { meteors.splice(j,1); continue; }
                        ctx.beginPath(); ctx.arc(m.x,m.y,m.size,0,Math.PI*2);
                        ctx.fillStyle='rgba(255,200,100,'+m.opacity+')'; ctx.fill();
                    }
                }
                requestAnimationFrame(drawStars);
            }
            drawStars();

            var skins = [
                { id: 'default', name: 'Звезда', icon: '✦', cost: 0, glow: 'rgba(180,160,255,0.5) 0%, rgba(80,60,200,0.15) 50%, transparent 70%', color: '#aabbff' },
                { id: 'pulsar', name: 'Пульсар', icon: '✧', cost: 1000, glow: 'rgba(100,255,200,0.5) 0%, rgba(0,200,100,0.15) 50%, transparent 70%', color: '#88ffcc' },
                { id: 'nova', name: 'Сверхновая', icon: '✶', cost: 5000, glow: 'rgba(255,100,50,0.6) 0%, rgba(255,50,0,0.2) 50%, transparent 70%', color: '#ff6644' },
                { id: 'galaxy', name: 'Галактика', icon: '✷', cost: 10000, glow: 'rgba(200,100,255,0.6) 0%, rgba(150,0,255,0.2) 50%, transparent 70%', color: '#cc88ff' },
                { id: 'void', name: 'Пустота', icon: '✬', cost: 25000, glow: 'rgba(0,0,0,0.8) 0%, rgba(50,0,100,0.3) 50%, transparent 70%', color: '#000000' },
                { id: 'sun', name: 'Солнце', icon: '✺', cost: 50000, glow: 'rgba(255,255,0,0.7) 0%, rgba(255,150,0,0.3) 50%, transparent 70%', color: '#ffdd00' },
                { id: 'quasar', name: 'Квазар', icon: '≛', cost: 100000, glow: 'rgba(0,200,255,0.8) 0%, rgba(0,100,255,0.3) 50%, transparent 70%', color: '#00ccff' },
                { id: 'god', name: 'Божество', icon: '⚝', cost: 1000000, glow: 'rgba(255,255,255,1) 0%, rgba(200,200,255,0.5) 50%, transparent 70%', color: '#ffffff' }
            ];

            var starCount = 0, clickPower = 1, activeSkin = 'default', ownedSkins = ['default'];
            var clicksToday = 0, maxClicksToday = 500;
            var dailyStreak = 0, lastClaimDate = '';
            var critChance = 10, critMultiplier = 3;
            var autoClickerLevel = 0, autoClickerInterval = null;
            var unlimitedClicks = false, doubleStars = false;

            function loadGame() {
                try {
                    var d = JSON.parse(localStorage.getItem('cosmic7_'+userId)||'{}');
                    starCount=d.starCount||0; clickPower=d.clickPower||1; activeSkin=d.activeSkin||'default';
                    ownedSkins=d.ownedSkins||['default']; clicksToday=d.clicksToday||0;
                    maxClicksToday=d.maxClicksToday||500; dailyStreak=d.dailyStreak||0;
                    lastClaimDate=d.lastClaimDate||''; critChance=d.critChance||10;
                    critMultiplier=d.critMultiplier||3; autoClickerLevel=d.autoClickerLevel||0;
                    unlimitedClicks=d.unlimitedClicks||false; doubleStars=d.doubleStars||false;
                } catch(e) {}
            }

            function saveGame() {
                try { localStorage.setItem('cosmic7_'+userId, JSON.stringify({
                    starCount, clickPower, activeSkin, ownedSkins, clicksToday,
                    maxClicksToday, dailyStreak, lastClaimDate, critChance,
                    critMultiplier, autoClickerLevel, unlimitedClicks, doubleStars
                })); } catch(e) {}
                updateLeaderboard();
            }

            window.addEventListener('beforeunload', saveGame);
            window.addEventListener('pagehide', saveGame);

            function getSkin() { for(var i=0;i<skins.length;i++) if(skins[i].id===activeSkin) return skins[i]; return skins[0]; }

            function updateUI() {
                document.getElementById('counter').textContent = starCount + ' ✦';
                var lt = unlimitedClicks ? '∞' : (clicksToday+'/'+maxClicksToday);
                var extra = [];
                if (unlimitedClicks) extra.push('БЕЗЛИМИТ');
                if (doubleStars) extra.push('x2');
                document.getElementById('perClick').textContent = '+' + clickPower + ' | Крит:' + critChance + '% x' + critMultiplier + (extra.length?' | '+extra.join(' | '):'');
                document.getElementById('starDisplay').textContent = '✦: ' + starCount;
                document.getElementById('limitDisplay').textContent = lt;
                var sk = getSkin();
                document.getElementById('clickSkin').textContent = sk.icon;
                document.getElementById('clickSkin').style.textShadow = '0 0 40px ' + sk.color + ', 0 0 80px ' + sk.color;
                document.getElementById('clickGlow').style.background = 'radial-gradient(circle, ' + sk.glow + ')';
                updateBonusBar(); renderAll(); updateAutoClicker(); saveGame();
            }

            function spawnText(x,y,txt,crit) {
                var el = document.createElement('div');
                el.className = 'floating-text' + (crit?' crit-text':'');
                el.textContent = txt; el.style.left = Math.max(0,x-30)+'px'; el.style.top = Math.max(0,y-25)+'px';
                document.body.appendChild(el); setTimeout(function(){ el.remove(); }, 800);
            }

            function showReward(icon, text, amount) {
                document.getElementById('rewardIcon').textContent = icon;
                document.getElementById('rewardText').textContent = text;
                document.getElementById('rewardAmount').textContent = amount;
                document.getElementById('rewardPopup').style.display = 'block';
                setTimeout(function() { document.getElementById('rewardPopup').style.display = 'none'; }, 2500);
            }

            var clickTimestamps = [], BLOCK_DURATION = 5000, clickBlockedUntil = 0, warningCount = 0;
            function isAutoClicker() {
                var n = Date.now();
                if (n < clickBlockedUntil) return true;
                clickTimestamps.push(n);
                while (clickTimestamps.length && clickTimestamps[0] < n-1000) clickTimestamps.shift();
                if (clickTimestamps.length > 15) { warningCount++; clickBlockedUntil = n+BLOCK_DURATION*warningCount; clickTimestamps=[]; return true; }
                return false;
            }

            document.getElementById('clickArea').addEventListener('click', function(e) {
                if (!unlimitedClicks && clicksToday >= maxClicksToday) { spawnText(e.clientX, e.clientY, 'ЛИМИТ', false); return; }
                if (isAutoClicker()) { spawnText(e.clientX, e.clientY, 'СТОП', false); updateUI(); return; }
                var gained = clickPower, isCrit = false;
                if (Math.random()*100 < critChance) { gained = Math.floor(clickPower*critMultiplier); isCrit = true; }
                if (meteorShowerActive) { gained *= 5; isCrit = true; }
                if (doubleStars) gained *= 2;
                starCount += gained; clicksToday++;
                spawnText(e.clientX, e.clientY, '+' + gained + (isCrit?' ⚡':''), isCrit);
                updateUI();
            });

            function updateAutoClicker() {
                if (autoClickerInterval) clearInterval(autoClickerInterval);
                if (autoClickerLevel > 0) {
                    var sp = [0,2000,1500,1000,600,300][autoClickerLevel]||2000;
                    var pt = [0,1,1,2,3,5][autoClickerLevel]||1;
                    autoClickerInterval = setInterval(function() {
                        if (unlimitedClicks || clicksToday < maxClicksToday) {
                            var g = clickPower*pt; if (meteorShowerActive) g*=5; if (doubleStars) g*=2;
                            starCount += g; clicksToday += pt; updateUI();
                        }
                    }, sp);
                }
            }

            function triggerShower() { meteorShowerActive=true; meteors=[]; document.getElementById('meteorAlert').style.display='block'; setTimeout(function(){ meteorShowerActive=false; document.getElementById('meteorAlert').style.display='none'; }, 10000); }
            setInterval(function() { if (!meteorShowerActive && Math.random()<0.3) triggerShower(); }, 300000);

            function spawnBonus() {
                var el = document.createElement('div'); el.className='floating-bonus'; el.textContent='💫';
                el.style.left = Math.random()*(innerWidth-70)+'px'; el.style.top = Math.random()*(innerHeight-250)+120+'px';
                document.body.appendChild(el);
                var amt = Math.floor(Math.random()*900)+100;
                el.addEventListener('click', function(ev) { ev.stopPropagation(); starCount+=amt; spawnText(ev.clientX,ev.clientY,'+'+amt+' БОНУС',true); el.remove(); updateUI(); });
                setTimeout(function() { if(el.parentNode) el.remove(); }, 8000);
            }
            setInterval(function() { if (Math.random()<0.5) spawnBonus(); }, 45000);

            function updateBonusBar() {
                var t = new Date().toDateString();
                document.getElementById('claimBonusBtn').textContent = lastClaimDate===t ? '✓' : 'Забрать';
                document.getElementById('claimBonusBtn').style.background = lastClaimDate===t ? '#00aa44' : '#ff8800';
                document.getElementById('claimBonusBtn').disabled = lastClaimDate===t;
                document.getElementById('streakDisplay').textContent = 'День '+(dailyStreak+1);
            }

            document.getElementById('claimBonusBtn').addEventListener('click', function() {
                var t = new Date().toDateString(), y = new Date(Date.now()-86400000).toDateString();
                if (lastClaimDate===t) return;
                dailyStreak = (lastClaimDate===y||lastClaimDate==='') ? dailyStreak+1 : 1;
                var bonus = dailyStreak*100+Math.floor(Math.random()*200);
                starCount += bonus; lastClaimDate = t;
                showReward('🔥', 'ЕЖЕДНЕВНЫЙ БОНУС!', '+' + bonus + ' ✦');
                updateUI();
            });

            function switchTab(n) {
                document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
                document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active')});
                document.getElementById(n+'Tab').classList.add('active');
                document.getElementById(n).classList.add('active');
            }
            document.getElementById('invTab').addEventListener('click', function(){switchTab('inventory')});
            document.getElementById('skinsTab').addEventListener('click', function(){switchTab('skins')});
            document.getElementById('shopTab').addEventListener('click', function(){switchTab('shop')});
            document.getElementById('lbTab').addEventListener('click', function(){switchTab('leaderboard')});

            function renderInventory() {
                var s = getSkin();
                document.getElementById('inventory').innerHTML =
                    '<div class="item-row"><span>🎨 Скин</span><span>'+s.icon+' '+s.name+'</span></div>'+
                    '<div class="item-row"><span>⚡ Сила</span><span>x'+clickPower+'</span></div>'+
                    '<div class="item-row"><span>🎯 Крит</span><span>'+critChance+'% x'+critMultiplier+'</span></div>'+
                    '<div class="item-row"><span>🤖 Автоклик</span><span>Ур.'+autoClickerLevel+'/5</span></div>'+
                    '<div class="item-row"><span>🔓 Лимит</span><span>'+(unlimitedClicks?'Безлимит':maxClicksToday+'/день')+'</span></div>'+
                    '<div class="item-row"><span>💫 x2 Звёзд</span><span>'+(doubleStars?'Да':'Нет')+'</span></div>'+
                    '<div class="item-row"><span>💾 Сохранение</span><span style="color:#00ff88;">Активно</span></div>';
            }

            function renderSkins() {
                var h = '';
                for (var i=0;i<skins.length;i++) {
                    var s=skins[i], owned=ownedSkins.indexOf(s.id)!==-1, active=activeSkin===s.id;
                    h += '<div class="item-row"><span>'+s.icon+' '+s.name+'</span>';
                    if (!owned) h += '<button data-id="'+s.id+'">'+s.cost+' ✦</button>';
                    else h += '<button class="'+(active?'active':'owned')+'" data-id="'+s.id+'">'+(active?'✓':'Выбрать')+'</button>';
                    h += '</div>';
                }
                document.getElementById('skins').innerHTML = h;
                document.getElementById('skins').querySelectorAll('button').forEach(function(b){
                    b.addEventListener('click', function(){
                        var id=this.dataset.id;
                        if (ownedSkins.indexOf(id)!==-1) { activeSkin=id; updateUI(); return; }
                        for (var j=0;j<skins.length;j++) {
                            if (skins[j].id===id && starCount>=skins[j].cost) {
                                starCount-=skins[j].cost; ownedSkins.push(id); activeSkin=id; updateUI(); return;
                            }
                        }
                    });
                });
            }

            var boostItems = [
                { id: 'b2', name: 'x2 Сила', icon: '⚡', cost: 500, power: 2 },
                { id: 'b5', name: 'x5 Сила', icon: '🔥', cost: 2000, power: 5 },
                { id: 'b10', name: 'x10 Сила', icon: '💥', cost: 5000, power: 10 },
                { id: 'critUp', name: 'Крит 25%', icon: '🎯', cost: 3000, critChance: 25 },
                { id: 'critUp2', name: 'Крит x10', icon: '💎', cost: 15000, critMultiplier: 10 },
                { id: 'auto1', name: 'Автоклик 1', icon: '🤖', cost: 2000, autoLevel: 1 },
                { id: 'auto2', name: 'Автоклик 2', icon: '🤖', cost: 8000, autoLevel: 2 },
                { id: 'auto3', name: 'Автоклик 3', icon: '🤖', cost: 25000, autoLevel: 3 },
                { id: 'l500', name: '+500 Кликов', icon: '🔓', cost: 300, limit: 500 },
                { id: 'l2000', name: '+2000 Кликов', icon: '🔓', cost: 1000, limit: 2000 },
            ];

            function renderShop() {
                var h = '';
                for (var i=0;i<boostItems.length;i++) {
                    var it=boostItems[i];
                    h += '<div class="item-row"><span>'+it.icon+' '+it.name+'</span><button '+(starCount>=it.cost?'':'disabled')+' data-id="'+it.id+'">'+it.cost+' ✦</button></div>';
                }
                document.getElementById('shop').innerHTML = h;
                document.getElementById('shop').querySelectorAll('button').forEach(function(b){
                    b.addEventListener('click', function(){
                        var id=this.dataset.id;
                        for (var j=0;j<boostItems.length;j++) {
                            var it=boostItems[j];
                            if (it.id===id && starCount>=it.cost) {
                                starCount-=it.cost;
                                if (it.power) clickPower=it.power;
                                if (it.limit) maxClicksToday+=it.limit;
                                if (it.critChance) critChance=it.critChance;
                                if (it.critMultiplier) critMultiplier=it.critMultiplier;
                                if (it.autoLevel && it.autoLevel>autoClickerLevel) autoClickerLevel=it.autoLevel;
                                updateUI(); break;
                            }
                        }
                    });
                });
            }

            function getLeaderboard() {
                var lb=[];
                for (var i=0;i<localStorage.length;i++) {
                    var k=localStorage.key(i);
                    if (k.indexOf('cosmic7_')===0) {
                        try { var d=JSON.parse(localStorage.getItem(k)); lb.push({id:k.replace('cosmic7_',''), stars:d.starCount||0, skin:d.activeSkin||'default'}); } catch(e) {}
                    }
                }
                lb.sort(function(a,b){return b.stars-a.stars});
                return lb.slice(0,50);
            }

            function updateLeaderboard() {
                var lb=getLeaderboard(), rank='-';
                for (var i=0;i<lb.length;i++) if (lb[i].id===userId) { rank='#'+(i+1); break; }
                document.getElementById('rankDisplay').textContent = '🏆 '+rank;
            }

            function renderLeaderboard() {
                var lb=getLeaderboard(), h='<div style="color:#8888ff;text-align:center;font-size:12px;margin-bottom:6px;">🏆 ТОП ИГРОКОВ</div>';
                for (var i=0;i<Math.min(lb.length,20);i++) {
                    var p=lb[i], nm=p.id===userId?'★ ВЫ':('Игрок '+p.id.slice(0,6));
                    var tc=''; if(i===0) tc=' top1'; if(i===1) tc=' top2'; if(i===2) tc=' top3';
                    var si='✦'; for(var j=0;j<skins.length;j++) if(skins[j].id===p.skin) { si=skins[j].icon; break; }
                    h += '<div class="leaderboard-item'+tc+'"><span>'+(i+1)+'. '+si+' '+nm+'</span><span>'+p.stars+' ✦</span></div>';
                }
                document.getElementById('leaderboard').innerHTML = h;
            }

            function renderAll() { renderInventory(); renderSkins(); renderShop(); renderLeaderboard(); }

            setInterval(function() {
                updateLeaderboard();
                if (document.getElementById('leaderboard').classList.contains('active')) renderLeaderboard();
            }, 30000);

            var today = new Date().toDateString();
            if (localStorage.getItem('cosmicDate7_'+userId)!==today) { clicksToday=0; localStorage.setItem('cosmicDate7_'+userId,today); }
            setInterval(function(){ var n=new Date().toDateString(); if(n!==today){ today=n; clicksToday=0; localStorage.setItem('cosmicDate7_'+userId,today); updateUI(); } }, 60000);

            loadGame(); updateUI();
        })();
    </script>
</body>
</html>
